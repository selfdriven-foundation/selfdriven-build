<style>
/* Layout: the workbench. Fixed glass nav, a cutting-mat hero with a ruler edge,
   content on a 1120px column. Dark 4Cs system, led by Constructive mint. */
:root{
  --bg:#09090f; --surface:#111118; --surface2:#18181f;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --text:#f0eeff; --muted:#7e7a9a; --muted2:#3d3a55;
  --curious:#f5c842; --caring:#ff5f7e; --constructive:#00e5a0; --chill:#7b6cff; --chill-bright:#9b8fff;
  --curious-dim:rgba(245,200,66,.13); --caring-dim:rgba(255,95,126,.13);
  --constructive-dim:rgba(0,229,160,.13); --chill-dim:rgba(123,108,255,.13);
  --mat:rgba(0,229,160,.055); --mat2:rgba(0,229,160,.13); --mat3:rgba(0,229,160,.45);
  --screen:#04100c; --ink-on-mint:#03140e; --scrim:rgba(9,9,15,.55); --navbg:rgba(9,9,15,.72);
  --pill:999px;
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --wrap:1120px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--constructive);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:24px}
@media (max-width:520px){.wrap{padding-inline:18px}}
.mono{font-family:var(--f-mono)}
.icon{width:1em;height:1em;flex:none}

/* ---------- custom cursor (desktop only, added by script) ---------- */
.cursor-dot,.cursor-ring{display:none}
.cur body,.cur a,.cur button,.cur label{cursor:none}
.cur .cursor-dot{display:block;position:fixed;top:0;left:0;width:8px;height:8px;border-radius:50%;background:var(--constructive);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:background .2s}
.cur .cursor-ring{display:block;position:fixed;top:0;left:0;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(240,238,255,.3);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.nav-in{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:inline-flex;align-items:center;gap:11px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.04em;text-decoration:none;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:50%;filter:drop-shadow(0 0 10px rgba(0,229,160,.35))}
.brand em{font-style:normal;color:var(--constructive)}
.crumb{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--text)}
.nav-links{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav-links a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:var(--pill);transition:color .2s,background .2s;white-space:nowrap}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav-links a.nav-cta{color:var(--constructive);border:1.5px solid rgba(0,229,160,.32);background:var(--constructive-dim);font-weight:600;margin-left:8px;display:inline-flex;align-items:center;gap:6px}
.nav-links a.nav-cta:hover{background:rgba(0,229,160,.2);color:var(--constructive)}
@media (max-width:820px){.nav-links a:not(.nav-cta){display:none}}
@media (max-width:420px){.crumb{display:none}.nav-links a.nav-cta{padding:7px 12px;font-size:13px}}

/* ---------- hero shell: blobs + cutting mat + ruler ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;padding-top:calc(132px + env(safe-area-inset-top,0px))}
.gblob{position:absolute;border-radius:50%;filter:blur(95px);opacity:.5;z-index:-2;pointer-events:none}
.gb1{width:420px;height:420px;background:var(--curious);top:-170px;left:-170px;animation:gb 15s ease-in-out infinite;opacity:.32}
.gb2{width:380px;height:380px;background:var(--caring);top:60px;right:-160px;animation:gb 19s ease-in-out infinite reverse;opacity:.3}
.gb3{width:620px;height:520px;background:var(--constructive);top:120px;left:22%;animation:gb 23s ease-in-out infinite 3s;opacity:.36}
.gb4{width:320px;height:320px;background:var(--chill);bottom:-80px;right:14%;animation:gb 17s ease-in-out infinite 8s;opacity:.38}
@keyframes gb{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(34px,-26px) scale(1.08)}70%{transform:translate(-22px,30px) scale(.93)}}
.mat{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--mat2) 1px,transparent 1px),linear-gradient(90deg,var(--mat2) 1px,transparent 1px),linear-gradient(var(--mat) 1px,transparent 1px),linear-gradient(90deg,var(--mat) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 35%,transparent 85%);mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 35%,transparent 85%)}
.ruler{position:relative;height:38px;margin-top:84px;border-top:1px solid var(--border2);overflow:hidden;white-space:nowrap;
  background:repeating-linear-gradient(90deg,var(--mat2) 0 1px,transparent 1px 10px) left top/100% 8px no-repeat,repeating-linear-gradient(90deg,transparent 0 50px,var(--mat2) 50px 51px,transparent 51px 100px) left top/100% 13px no-repeat,repeating-linear-gradient(90deg,var(--mat3) 0 1px,transparent 1px 100px) left top/100% 18px no-repeat}
.ruler span{display:inline-block;width:100px;padding:19px 0 0 4px;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.04em}

.hero-pill{display:inline-flex;align-items:center;gap:8px;background:var(--scrim);border:1px solid rgba(255,255,255,.22);border-radius:var(--pill);padding:8px 18px;font-size:12px;font-weight:500;color:rgba(240,238,255,.75);letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--constructive);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,229,160,.55)}70%{box-shadow:0 0 0 9px rgba(0,229,160,0)}100%{box-shadow:0 0 0 0 rgba(0,229,160,0)}}

/* ---------- buttons + pills ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:var(--pill);font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,color .2s;border:1.5px solid transparent}
.btn .icon{font-size:18px}
.btn-primary{background:var(--constructive);color:var(--ink-on-mint)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,229,160,.28)}
.btn-ghost{border-color:var(--border2);color:var(--text);background:var(--scrim)}
.btn-ghost:hover{border-color:rgba(0,229,160,.5);color:var(--constructive);transform:translateY(-3px)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.mode-pill{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:var(--pill);font-family:var(--f-display);font-size:14px;font-weight:600;text-decoration:none;border:1.5px solid transparent;transition:transform .2s,box-shadow .2s}
.mode-pill .icon{font-size:16px}
.mode-pill:hover{transform:translateY(-4px) rotate(-1.5deg);box-shadow:0 14px 36px rgba(0,0,0,.5)}
.mp-c{background:var(--curious-dim);color:var(--curious);border-color:rgba(245,200,66,.28)}
.mp-k{background:var(--caring-dim);color:var(--caring);border-color:rgba(255,95,126,.28)}
.mp-b{background:var(--constructive-dim);color:var(--constructive);border-color:rgba(0,229,160,.28)}
.mp-l{background:var(--chill-dim);color:var(--chill-bright);border-color:rgba(123,108,255,.28)}
.mp-b.on{border-color:var(--constructive);box-shadow:0 0 0 5px rgba(0,229,160,.12)}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:var(--pill);border:1px solid var(--border2);color:var(--muted);white-space:nowrap}
.t-c{color:var(--curious);border-color:rgba(245,200,66,.3);background:var(--curious-dim)}
.t-k{color:var(--caring);border-color:rgba(255,95,126,.3);background:var(--caring-dim)}
.t-b{color:var(--constructive);border-color:rgba(0,229,160,.3);background:var(--constructive-dim)}
.t-l{color:var(--chill-bright);border-color:rgba(123,108,255,.3);background:var(--chill-dim)}
.t-ck{border-color:rgba(255,255,255,.18);background:linear-gradient(90deg,var(--curious-dim),var(--caring-dim))}
.t-ck b{font-weight:500;color:var(--curious)} .t-ck i{font-style:normal;color:var(--caring)}

/* ---------- sections + type ---------- */
.block{padding-block:112px}
.block-tight{padding-block:80px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--constructive);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:'//';color:var(--muted2);letter-spacing:0}
.h2{font-family:var(--f-display);font-weight:800;letter-spacing:-.04em;line-height:1.02;font-size:clamp(36px,5.6vw,66px);margin:14px 0 0;text-wrap:balance}
.h2 em{font-style:normal;color:var(--constructive)}
.h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;line-height:1.15;font-size:24px;margin:0;text-wrap:balance}
.lede{font-size:19px;line-height:1.6;color:var(--muted);max-width:60ch;margin-top:18px}
.lede strong{color:var(--text);font-weight:600}
.sec-head{margin-bottom:52px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px}

/* marquee */
.marquee{border-block:1px solid var(--border);overflow:hidden;padding-block:18px;background:var(--surface)}
.marquee-track{display:flex;width:max-content;animation:mq 46s linear infinite;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.marquee-track span{padding-right:30px;color:var(--muted)}
.marquee-track span b{color:var(--constructive);font-weight:700}
@keyframes mq{to{transform:translateX(-50%)}}

/* deck drawing */
.deck-svg{width:100%;height:auto;max-width:460px}
.d-body{fill:var(--surface);stroke:var(--constructive);stroke-width:1.6}
.d-lid{fill:var(--surface2);stroke:var(--constructive);stroke-width:1.6}
.d-screen{fill:var(--screen);stroke:var(--mat3);stroke-width:1}
.d-key{fill:var(--surface2);stroke:rgba(0,229,160,.35);stroke-width:1}
.d-key-w{fill:var(--constructive-dim);stroke:rgba(0,229,160,.6);stroke-width:1}
.d-faint{fill:none;stroke:rgba(0,229,160,.35);stroke-width:1}
.d-line{fill:none;stroke:var(--constructive);stroke-width:1.6;stroke-linecap:round}
.d-dim{fill:none;stroke:var(--muted);stroke-width:1}
.d-dimtxt{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em}
.d-term{fill:var(--constructive);font-family:var(--f-mono);font-size:12.5px}
.d-term-m{fill:rgba(0,229,160,.55);font-family:var(--f-mono);font-size:12.5px}
.d-screw{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.d-c{fill:var(--curious)}.d-k{fill:var(--caring)}.d-b{fill:var(--constructive)}.d-l{fill:var(--chill)}
.d-knob{fill:var(--surface2);stroke:var(--constructive);stroke-width:1.4}
.d-caret{fill:var(--constructive);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* build plates (spec plates) */
.plate{display:flex;flex-direction:column;gap:18px;text-decoration:none;padding:30px 32px;position:relative;transition:background .25s;min-width:0}
.plate:hover{background:rgba(0,229,160,.035)}
.plate-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.plate .board{font-family:var(--f-mono);font-size:12px;color:var(--constructive);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px}
.plate h3{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.035em;line-height:1;margin:0}
.plate p{color:var(--muted);font-size:16px;max-width:52ch}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:0}
.specs div{background:var(--bg);padding:11px 14px;min-width:0}
.specs dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.specs dd{margin:3px 0 0;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.35}
.go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;color:var(--constructive);font-size:16px}
.go .icon{transition:transform .2s}
.plate:hover .go .icon,a:hover>.go .icon{transform:translateX(4px)}
.serial{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--border2);border-radius:6px;padding:3px 7px;letter-spacing:.06em}

/* footer */
.foot{border-top:1px solid var(--border);padding-block:64px 40px;background:var(--surface)}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px}
.foot h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 14px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.foot li a{text-decoration:none;color:var(--text);font-size:15px;opacity:.85}
.foot li a:hover{color:var(--constructive);opacity:1}
.foot .sign{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;font-size:26px;line-height:1.1;margin-top:18px}
.foot .sign span{display:block}
.foot .sign .c{color:var(--curious)}.foot .sign .b{color:var(--constructive)}.foot .sign .k{color:var(--caring)}.foot .sign .l{color:var(--chill-bright)}
.foot-note{color:var(--muted);font-size:14px;margin-top:14px;max-width:44ch}
.foot-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:52px;padding-top:22px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.foot-bottom a{color:var(--muted)}.foot-bottom a:hover{color:var(--text)}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr 1fr}.foot-grid>:first-child{grid-column:1/-1}}

/* reveal: content is visible at rest; only below-the-fold blocks get the entrance */
.reveal{transition:opacity .6s,transform .6s cubic-bezier(.34,1.56,.64,1)}
.reveal.pre{opacity:0;transform:translateY(28px)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .gblob,.marquee-track,.hero-pill .dot,.d-caret,.px-beam,.v-pulse{animation:none}
  .reveal{transition:none}
  .mode-pill,.btn,.go .icon{transition:none}
}

.nf{min-height:72vh;display:flex;align-items:center}
.nf h1{font-family:var(--f-display);font-weight:800;letter-spacing:-.05em;line-height:.9;font-size:clamp(52px,10vw,120px);margin:22px 0 0}
.nf h1 span{color:var(--constructive)}
</style>
</head>

<script>
(function(){
  // Custom cursor: desktop pointers only, so touch and keyboard users keep the native one.
  var fine = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (fine) {
    document.documentElement.classList.add('cur');
    var dot = document.getElementById('cdot'), ring = document.getElementById('cring');
    var rx = 0, ry = 0, dx = 0, dy = 0;
    document.addEventListener('mousemove', function(e){ dx = e.clientX; dy = e.clientY; dot.style.left = dx + 'px'; dot.style.top = dy + 'px'; });
    (function loop(){ rx += (dx - rx) * .18; ry += (dy - ry) * .18; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(loop); })();
    document.querySelectorAll('a,button,.task').forEach(function(el){
      el.addEventListener('mouseenter', function(){ ring.style.width = '52px'; ring.style.height = '52px'; ring.style.borderColor = 'rgba(0,229,160,.6)'; });
      el.addEventListener('mouseleave', function(){ ring.style.width = '34px'; ring.style.height = '34px'; ring.style.borderColor = 'rgba(240,238,255,.3)'; });
    });
  }
  // Scroll reveal: anything already on screen stays put; only blocks below the fold animate in.
  if (!calm && 'IntersectionObserver' in window) {
    var vh = window.innerHeight || 800;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(x){ if (x.isIntersecting) { x.target.classList.remove('pre'); io.unobserve(x.target); } });
    }, { threshold: .14 });
    document.querySelectorAll('.reveal').forEach(function(el){
      if (el.getBoundingClientRect().top > vh * .92) { el.classList.add('pre'); io.observe(el); }
    });
  }
})();

</script>
